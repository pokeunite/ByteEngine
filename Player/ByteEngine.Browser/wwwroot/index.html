<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ByteEngine Game</title><link rel="icon" type="image/png" href="./engine-icon.png">
<style>
html,body{margin:0;background:#10161e;color:#e9edf2;font:15px system-ui,sans-serif;overflow:hidden}
canvas{position:absolute;width:100%;height:100%}#ui{pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#10161e;z-index:2}
#loading:has(#status[hidden]){display:none}#loading img{width:min(580px,80vw);height:auto}
#status{cursor:pointer;margin:0 24px;max-width:900px;text-align:center;white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
#retry{margin-top:24px;background:#2986c5;color:white;border:0;border-radius:4px;padding:12px 28px;font:inherit;cursor:pointer}
</style></head><body><canvas id="game" tabindex="0"></canvas><canvas id="ui"></canvas>
<div id="loading"><img src="./engine-splash.gif" alt="ByteEngine"><div id="status" role="status" aria-live="polite">Loading ByteEngine…</div><button id="retry" hidden>Retry loading</button></div>
<script type="module" src="./main.js"></script></body></html>
